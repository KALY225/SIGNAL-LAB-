name: SIGNAL LAB C11 CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and profiling tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      - name: Compile SIGNAL LAB
        run: make all

      - name: Run Unit Test Suite
        run: make test

      - name: Run Valgrind Memory Audit on Unit Tests
        run: |
          for t in bin/test_*; do
            valgrind --error-exitcode=1 --leak-check=full ./$t
          done
